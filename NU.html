<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü mit Vorschaukacheln</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
            overflow: hidden;
        }
        h1 {
            margin: 20px 0;
            color: #333;
        }
        .menu {
            display: flex;
            gap: 20px;
            margin: 20px;
        }
        .tile {
            width: 200px;
            height: 112.5px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            overflow: hidden;
            position: relative;
        }
        .tile:hover {
            transform: scale(1.05);
        }
        .tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        .tile-preview {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
            position: absolute;
            top: 0;
            left: 0;
            visibility: hidden;
        }
        .tile-preview.loaded {
            visibility: visible;
        }
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .fullscreen-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .fullscreen-content iframe {
            width: 1920px;
            height: 1080px;
            border: none;
            background-color: #000;
        }
        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #fff;
            z-index: 1001;
        }
        .close-button:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    <h1>Menü</h1>
    <div class="menu">
        <div class="tile" onclick="openFullscreen('NU.html')">
            <iframe class="tile-preview" src="NU.html" frameborder="0" scrolling="no" onload="this.classList.add('loaded')"></iframe>
        </div>
        <div class="tile" onclick="openFullscreen('EW.html')">
            <iframe class="tile-preview" src="EW.html" frameborder="0" scrolling="no" onload="this.classList.add('loaded')"></iframe>
        </div>
    </div>

    <div id="fullscreen" class="fullscreen">
        <span class="close-button" onclick="closeFullscreen()">&times;</span>
        <div class="fullscreen-content">
            <iframe id="fullscreen-iframe" frameborder="0"></iframe>
        </div>
    </div>

    <script>
        // Cache für die geladenen Iframes
        const iframeCache = {};

        // Funktion zum Vorladen der Iframes
        function preloadIframe(url) {
            if (!iframeCache[url]) {
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.display = 'none';
                iframe.style.visibility = 'hidden';
                document.body.appendChild(iframe);
                iframeCache[url] = iframe;
            }
        }

        // Vorladen der Iframes beim Laden der Seite
        window.addEventListener('load', function() {
            preloadIframe('NU.html');
            preloadIframe('EW.html');
        });

        // Funktion zum Öffnen des Vollbildmodus
        function openFullscreen(url) {
            const fullscreen = document.getElementById('fullscreen');
            const fullscreenIframe = document.getElementById('fullscreen-iframe');

            // Setze die src des Vollbild-Iframes
            fullscreenIframe.src = url;

            // Zeige den Vollbildmodus sofort an
            fullscreen.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            // Falls das Iframe bereits im Cache ist, zeige es sofort an
            if (iframeCache[url]) {
                fullscreenIframe.onload = function() {
                    // Kein Aufzucken, da das Iframe bereits geladen ist
                };
            } else {
                // Falls nicht im Cache, warte auf das Laden
                fullscreenIframe.onload = function() {
                    // Iframe ist jetzt geladen
                };
            }
        }

        // Funktion zum Schließen des Vollbildmodus
        function closeFullscreen() {
            const fullscreen = document.getElementById('fullscreen');
            fullscreen.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Schließen mit der ESC-Taste
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeFullscreen();
            }
        });
    </script>
</body>
</html>
