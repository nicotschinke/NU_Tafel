<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="authoring-tool" content="Adobe_Animate_CC">
    <title>NU</title>
    <!-- $EMBED_IMAGES -->
    <!-- $EMBED_LABELS -->
    <script src="https://code.createjs.com/1.0.0/createjs.min.js" defer></script>
    <script src="NU.js" defer></script>
    <script>
        var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;

        window.onload = function() {
            if (!window.AdobeAn) {
                setTimeout(arguments.callee, 100);
                return;
            }
            init();
        };

        function init() {
            canvas = document.getElementById("canvas");
            anim_container = document.getElementById("animation_container");
            dom_overlay_container = document.getElementById("dom_overlay_container");

            var comp = AdobeAn.getComposition("9A27D9E747957B46937F8511DE0476E9");
            var lib = comp.getLibrary();

            var loader = new createjs.LoadQueue(false);
            loader.addEventListener("fileload", handleFileLoad);
            loader.addEventListener("complete", handleComplete);
            loader.loadManifest(lib.properties.manifest);
        }

        function handleFileLoad(evt) {
            var images = AdobeAn.getImages();
            if (evt && (evt.item.type == "image")) {
                images[evt.item.id] = evt.result;
            }
        }

        function handleComplete(evt) {
            var comp = AdobeAn.getComposition("9A27D9E747957B46937F8511DE0476E9");
            var lib = comp.getLibrary();
            var ss = comp.getSpriteSheet();
            var queue = evt.target;
            var ssMetadata = lib.ssMetadata;

            for (var i = 0; i < ssMetadata.length; i++) {
                ss[ssMetadata[i].name] = new createjs.SpriteSheet({
                    "images": [queue.getResult(ssMetadata[i].name)],
                    "frames": ssMetadata[i].frames
                });
            }

            exportRoot = new lib.RECOVER_WIEDERHERGESTELLT_NU();
            stage = new lib.Stage(canvas);
            stage.addChild(exportRoot); // WICHTIG: exportRoot zur Stage hinzufügen!

            // Standard-Animate-Code für Responsive Scaling
            AdobeAn.makeResponsive(true, 'both', false, 1, [canvas, anim_container, dom_overlay_container]);
            AdobeAn.compositionLoaded(lib.properties.id);

            // Ihren Code aus NU.js aufrufen
            window.root = exportRoot;
            if (window.initNUCode) {
                initNUCode();
            }

            stage.update(); // WICHTIG: Stage aktualisieren!
        }
    </script>
</head>
<body style="margin:0px;">
    <div id="animation_container" style="background-color:rgba(255, 255, 255, 1.00); width:1920px; height:1080px;">
        <canvas id="canvas" width="1920" height="1080" style="position: absolute; display: block; background-color:rgba(255, 255, 255, 1.00);"></canvas>
        <div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:1920px; height:1080px; position: absolute; left: 0px; top: 0px; display: block;"></div>
    </div>
</body>
</html>
